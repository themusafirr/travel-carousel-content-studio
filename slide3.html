<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Slide 3 - Trip Essentials</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #2C4797; font-family: 'Georgia', serif; }
.slide {
  width: 1080px; height: 1080px;
  background: #2C4797; color: white;
  display: flex; flex-direction: column; padding: 60px 80px;
}
.header { width: 100%; }
.slide h1 { font-size: 65px; margin-bottom: 10px; font-weight: bold; }
.sub { font-size: 28px; color: #B8C5E0; font-weight: bold; margin-bottom: 80px; }
.info-row { display: flex; justify-content: space-around; width: 100%; margin-top: 60px; }
.info-box {
  background: #6B85C4; border-radius: 60px;
  padding: 30px 50px; font-size: 60px; font-weight: bold;
}
.info-labels { display: flex; justify-content: space-around; width: 100%; margin-top: 60px; gap: 80px; }
.info-text { text-align: left; max-width: 400px; }
.info-text h3 { font-size: 30px; margin-bottom: 15px; font-weight: bold; }
.info-text p { font-size: 22px; opacity: 0.9; }
</style>
</head>
<body>
<div class="slide">
  <div class="header">
    <h1>Rawatbhata Trip Essentials</h1>
    <div class="sub">Best Time to Visit & Budget</div>
  </div>
  <div class="info-row">
    <div class="info-box">October-March</div>
    <div class="info-box">₹2000-4000</div>
  </div>
  <div class="info-labels">
    <div class="info-text">
      <h3>Ideal Visiting Months</h3>
      <p>Perfect weather for outdoor exploration.</p>
    </div>
    <div class="info-text">
      <h3>Budget for 3 Days</h3>
      <p>Affordable and enjoyable trip experience.</p>
    </div>
  </div>
</div>
</body>
</html>
