<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Slide 1 - Rawatbhata Cover</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #2C4797; font-family: 'Georgia', serif; }
.slide-1 {
  width: 1080px; height: 1080px;
  background: #2C4797;
  position: relative; overflow: hidden;
  display: flex; align-items: center;
  color: white; padding: 60px;
}
.image-box {
  width: 480px; height: 720px;
  border-radius: 20px; overflow: hidden;
  background: #1a2a52;
  flex-shrink: 0;
  position: relative;
}
.image-box img { width: 100%; height: 100%; object-fit: cover; }
.image-overlay {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(44,71,151,0.9));
  padding: 30px 25px 25px;
  color: white;
}
.image-overlay .location {
  font-size: 24px;
  font-weight: bold;
}
.text-area {
  flex: 1; padding-left: 50px;
  display: flex; flex-direction: column; justify-content: center;
}
.text-area h1 {
  font-size: 95px; font-weight: bold; line-height: 1; margin-bottom: 20px;
  font-family: 'Georgia', serif;
}
.flag-divider { display: flex; align-items: center; margin: 20px 0; gap: 20px; }
.flag {
  width: 60px; height: 40px;
  background: linear-gradient(to bottom, #FF9933 33%, #FFFFFF 33% 66%, #138808 66%);
  border-radius: 4px;
}
.pipe { font-size: 80px; font-weight: 200; }
.text-area h2 { font-size: 78px; font-weight: bold; line-height: 1.1; margin-bottom: 30px; }
.subtitle { font-size: 32px; margin-top: 30px; opacity: 0.9; }
.presenter { position: absolute; bottom: 60px; right: 60px; text-align: right; }
.presenter .name { font-size: 22px; font-weight: bold; color: #B8C5E0; }
.presenter .role { font-size: 20px; color: white; }
</style>
</head>
<body>
<div class="slide-1">
  <div class="image-box">
    <img src="rwt_fort2.jpg" alt="Rajasthan Fort - Rawatbhata Region">
    <div class="image-overlay">
      <div class="location">📍 Rawatbhata, Rajasthan</div>
    </div>
  </div>
  <div class="text-area">
    <h1>RAWATBHATA</h1>
    <div class="flag-divider">
      <div class="flag"></div>
      <span class="pipe">|</span>
    </div>
    <h2>Hidden<br>Gem of<br>Rajasthan</h2>
    <p class="subtitle">Discover the magic of our city</p>
  </div>
  <div class="presenter">
    <div class="name">[Pankaj Kalosiya]</div>
    <div class="role">Local Explorer & Guide</div>
  </div>
</div>
</body>
</html>
