<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Slide 4 - Insider Tips</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #2C4797; font-family: 'Georgia', serif; }
.slide {
  width: 1080px; height: 1080px;
  background: #2C4797; color: white;
  display: flex; padding: 60px 80px; gap: 50px;
}
.left { flex: 1; }
.left h1 { font-size: 80px; line-height: 1; margin-bottom: 20px; font-weight: bold; }
.left .sub { font-size: 28px; color: #B8C5E0; font-weight: bold; }
.right {
  flex: 1.1; background: white; color: #2C4797;
  border-radius: 20px; padding: 50px;
}
.tip { margin-bottom: 30px; }
.tip h3 { font-size: 28px; font-weight: bold; margin-bottom: 5px; }
.tip p { font-size: 20px; color: #4A5A8C; }
</style>
</head>
<body>
<div class="slide">
  <div class="left">
    <h1>Rawatbhata<br>Insider Tips</h1>
    <div class="sub">Expert Advice for Your Trip</div>
  </div>
  <div class="right">
    <div class="tip">
      <h3>Early Morning Walk</h3>
      <p>Start at 6 AM for cool weather and peaceful vibes.</p>
    </div>
    <div class="tip">
      <h3>Explore Nearby</h3>
      <p>Visit Chittorgarh Fort and Rana Pratap Sagar.</p>
    </div>
    <div class="tip">
      <h3>Local Market</h3>
      <p>Buy fresh sabzi and local mawa sweets.</p>
    </div>
    <div class="tip">
      <h3>Sunset Point</h3>
      <p>Dam ke paas sunset dekhna mat bhoolna.</p>
    </div>
  </div>
</div>
</body>
</html>
